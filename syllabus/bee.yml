# =============================================================================
# BASIC ELECTRICAL ENGINEERING  -  GCET 18EE1201
# =============================================================================
# Deliberately a NON-programming subject: it exercises the subject-general path
# in plan.py that the Java pilot never touched. No `code_language`, so the video
# prompt drops the "show real code on screen" rule and the audience line reads
# "meeting Basic Electrical Engineering for the first time" instead of "never
# written a line of Java".
#
# Topics transcribed from the course file's Syllabus section. That PDF's text
# layer is badly letter-spaced ("B A SIC ELEC T R IC A L"), which is exactly why
# syllabus derivation at scale should be done by asking the notebook rather than
# by parsing locally - NotebookLM reads the document natively.
#
# Note: this copy lives under CSE/I/SEMESTER - 1 but its own cover says
# Branch: ECE, Semester II. The per-branch copies are duplicates of one master.
# =============================================================================

subject:
  id: bee-y1
  title: Basic Electrical Engineering
  code: 18EE1201
  branch: Common
  year: I
  semester: II
  college: Geethanjali College of Engineering and Technology
  source_drive_id: 174SG1Q1xcSqCvvVYRtT1f3ZUJAJCtLpu
  source_title: Basic Electrical Engineering - Course File
  exclude_sections:
    - Vision and Mission of the Department
    - PEOs, POs and PSOs, course mapping tables
    - Class and individual time tables
    - University question papers, question bank, assignment topics, tutorial problems
    - Student lists and quality measurement sheets

pedagogy:
  # No code_language: this is not a programming subject.
  math: none

  language:
    plain_words:
      electromotive force: voltage push
      impedance: total opposition to AC
      commutation: switching
      excitation: supply
      attenuation: weakening
    banned_words:
      - elementary calculations
      - significance thereof
    term_example: >-
      a capacitor, a part that stores charge on two plates, blocks steady current
      but lets changing current through.
    adjective_example:
      bad: a linear bilateral passive circuit element under sinusoidal excitation
      good: a part that behaves the same whichever way the current flows

units:
  - n: 1
    id: u1
    title: "DC Circuits"
    topics: >-
      Electrical circuit elements R, L and C. Voltage and current sources.
      Kirchhoff's voltage law and Kirchhoff's current law. Analysis of simple
      circuits with dc excitation. Superposition theorem. Thevenin's theorem.
      Norton's theorem. Time-domain analysis of first-order RL and RC circuits.
    example: >-
      A separate small example per section, each with real numbers: two
      resistors on a 12 V battery solved with KVL; a different network reduced
      by Thevenin; a 100 uF capacitor charging through a resistor. Do not reuse
      one circuit for everything.
    exam_focus:
      - "KCL versus KVL: which one applies at a node and which around a loop"
      - "Thevenin versus Norton: voltage source in series or current source in parallel"
      - "why an RL or RC circuit takes time to settle while a resistive one does not"

  - n: 2
    id: u2
    title: "AC Circuits"
    topics: >-
      Representation of sinusoidal waveforms. Peak and rms values. Phasor
      representation. Real power, reactive power, apparent power, power factor.
      Analysis of single-phase ac circuits with R, L, C, RL, RC and RLC
      combinations in series and parallel. Resonance in a series RLC circuit.
      Three-phase balanced circuits. Voltage and current relations in star and
      delta connections.
    example: >-
      A separate example per section, each with real numbers: a 230 V 50 Hz
      supply across a resistor; then a coil added to show current lagging; then
      a power factor read off one worked case; then one series circuit tuned to
      resonance.
    exam_focus:
      - "peak versus rms, and why meters read rms"
      - "real versus reactive versus apparent power"
      - "star versus delta: which relation carries the root-three"

  - n: 3
    id: u3
    title: "Transformers"
    topics: >-
      Ideal and practical transformer. Equivalent circuit. Losses in
      transformers. Regulation and efficiency. Auto-transformer. Three-phase
      transformer connections.
    example: >-
      One 230 V to 12 V transformer for the turns ratio, with the numbers
      worked. Then separate short examples: where the losses appear as heat, and
      the same unit wired as an auto-transformer.
    exam_focus:
      - "copper loss versus iron loss, and which varies with load"
      - "regulation versus efficiency"
      - "transformer versus auto-transformer"

  - n: 4
    id: u4
    title: "Electrical Machines"
    topics: >-
      Generation of rotating magnetic fields. Construction and working of a
      three-phase induction motor. Significance of the torque-slip
      characteristic. Loss components and efficiency. Starting and speed control
      of an induction motor. Single-phase induction motor construction and
      working.
    example: >-
      A three-phase induction motor for the rotating field and torque, with a
      real speed in rpm. Then a separate reading of one torque-slip curve, and a
      separate single-phase motor starting method.
    exam_focus:
      - "slip: why an induction motor never reaches synchronous speed"
      - "starting torque versus running torque"
      - "three-phase versus single-phase induction motor"

  - n: 5
    id: u5
    title: "Electrical Installations"
    topics: >-
      Components of LT switchgear: switch fuse unit SFU, MCB, ELCB, MCCB. Types
      of wires and cables. Earthing. Types of batteries and their important
      characteristics. Calculations for energy consumption, power factor
      improvement and battery backup.
    example: >-
      Separate examples, one per protective device: an SFU, an MCB with a real
      current rating, an ELCB, and an earthing connection. Then one battery
      backup sizing with real amp-hours.
    exam_focus:
      - "MCB versus ELCB versus MCCB: what each one actually detects"
      - "earthing versus neutral"
      - "why improving power factor lowers the bill"
