name: Collect and postprocess

# Cheap poll on a cron. A poll is seconds; the generation it waits on is 20-30
# minutes. Anything finished gets downloaded, logo-swapped, transcribed for
# captions and real chapter timestamps, thumbnailed, and uploaded as an artifact.
#
# MP4s are intentionally NOT committed: ~350 lectures would blow past GitHub's
# repo size limits. They leave as build artifacts and are uploaded to Drive/R2
# by the publish stage.

on:
  # Best-effort safety net only. GitHub's scheduler is not dependable: a */20
  # schedule on this repository produced zero runs in its first hour. The job
  # itself polls (see watch_minutes), so a missed tick delays nothing.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      syllabus:
        description: "Syllabus file"
        required: true
        default: "syllabus/oop-java.yml"
      units:
        description: "Unit ids, space separated (blank = all pending)"
        required: false
        default: ""
      profile:
        required: false
        default: "default"
      whisper_model:
        description: "faster-whisper model size"
        required: false
        default: "small"
        type: choice
        options: ["tiny", "base", "small", "medium"]
      retry_failed:
        description: "Retry upstream generation failures in place"
        required: false
        default: false
        type: boolean
      reprocess:
        description: "Re-download and re-postprocess finished units (no video quota)"
        required: false
        default: false
        type: boolean
      watch_minutes:
        description: "Keep polling in-job for up to this many minutes (0 = single pass)"
        required: false
        default: "45"

permissions:
  contents: write

# Per-unit, so five units can be postprocessed in parallel instead of serially -
# 'preset slow' on five 12-minute videos is far too long to run one at a time.
# They all commit the manifest at the end, which is what the rebase-and-retry push
# loop in that step exists to handle.
concurrency:
  group: video-worker-collect-${{ inputs.units || 'all' }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # tesseract reads the word "NotebookLM" off the frame. That is the only
      # unambiguous way to find the mark: greyscale template correlation scored
      # our own replacement logo (0.65) above the real mark (0.64).
      - name: Install ffmpeg and tesseract
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The model is ~500MB and identical every run. Downloading it each time is
      # what got us rate limited (429) after five videos had already been made.
      - name: Cache whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ inputs.whisper_model || 'small' }}-v1

      - name: Restore NotebookLM auth
        env:
          NOTEBOOKLM_MASTER_TOKEN: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN }}
          NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        run: |
          MASTER="$NOTEBOOKLM_MASTER_TOKEN"
          SNAPSHOT="$NOTEBOOKLM_AUTH_JSON"
          unset NOTEBOOKLM_MASTER_TOKEN NOTEBOOKLM_AUTH_JSON
          PROFILE="${{ inputs.profile || 'default' }}"
          DIR="$HOME/.notebooklm/profiles/$PROFILE"
          mkdir -p "$DIR"
          if [ -n "$MASTER" ]; then
            printf '%s' "$MASTER" > "$DIR/master_token.json"
            chmod 600 "$DIR/master_token.json"
            notebooklm -p "$PROFILE" login --master-token-refresh
          elif [ -n "$SNAPSHOT" ]; then
            printf '%s' "$SNAPSHOT" > "$DIR/storage_state.json"
            chmod 600 "$DIR/storage_state.json"
          else
            echo "No NotebookLM auth configured." >&2; exit 1
          fi

      - name: Collect finished videos
        run: |
          # A scheduled run has no inputs, so this used to default to one
          # syllabus and every other subject sat in "generating" forever - BEE
          # units waited 24 hours untouched. With no syllabus given, sweep them
          # all.
          if [ -n "${{ inputs.syllabus }}" ]; then
            SYLS="${{ inputs.syllabus }}"
          else
            SYLS=$(ls syllabus/*.yml)
          fi
          echo "syllabi: $SYLS"
          ARGS=""
          for u in ${{ inputs.units }}; do ARGS="$ARGS --unit $u"; done
          rc=0
          for SYL in $SYLS; do
            echo "::group::collect $SYL"
            python src/collect.py --syllabus "$SYL" $ARGS \
              ${{ inputs.reprocess == true && '--reprocess' || '' }} \
              --watch-minutes "${{ inputs.watch_minutes || 45 }}" --interval 180 \
              ${{ inputs.retry_failed == true && '--retry-failed' || '' }} || rc=1
            echo "::endgroup::"
          done
          exit $rc

      - name: Postprocess anything downloaded
        env:
          # Cosmetic only: silences the HF Hub rate-limit notice on model
          # download. ORT_LOGGING_LEVEL trims onnxruntime's device-discovery
          # warning from the silero VAD; it is emitted by native code so a line
          # may still slip through, and it is harmless either way.
          HF_HUB_DISABLE_TELEMETRY: "1"
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ORT_LOGGING_LEVEL: "3"
          OMP_NUM_THREADS: "2"
        run: |
          # Pair each downloaded unit with ITS OWN syllabus. Using one syllabus
          # for everything would postprocess a Basic Electrical Engineering unit
          # against the Java syllabus and silently mislabel its chapters.
          python - <<'PY' > work.txt
          import glob, json, pathlib, yaml
          subj = {}
          for p in glob.glob("syllabus/*.yml"):
              try:
                  subj[yaml.safe_load(open(p))["subject"]["id"]] = p
              except Exception:
                  pass
          man = pathlib.Path("state/manifest.json")
          units = json.loads(man.read_text())["units"] if man.exists() else {}
          for key, rec in sorted(units.items()):
              if rec.get("state") != "downloaded":
                  continue
              # The manifest is shared across runs but build/ is not: every run
              # gets a clean runner. A unit downloaded by an earlier run is still
              # marked "downloaded" while its file lives on a machine that is
              # gone, so postprocessing it here fails with "no downloaded video".
              # Only take units whose raw file is actually present.
              raw = rec.get("raw_mp4")
              if not raw or not pathlib.Path(raw).exists():
                  continue
              syl = subj.get(rec.get("subject"))
              if syl:
                  print(syl, rec["unit"])
          PY
          if [ ! -s work.txt ]; then echo "Nothing to postprocess."; exit 0; fi
          cat work.txt
          FAILED=""
          while read SYL U; do
            echo "::group::postprocess $SYL $U"
            if ! python src/postprocess.py --syllabus "$SYL" --unit "$U" \
                 --whisper-model "${{ inputs.whisper_model || 'small' }}"; then
              echo "postprocess failed for $SYL $U"
              FAILED="$FAILED $SYL/$U"
            fi
            echo "::endgroup::"
          done < work.txt
          if [ -n "$FAILED" ]; then
            echo "::warning::postprocess failed for:$FAILED"
            exit 1
          fi

      - name: Upload finished lectures
        uses: actions/upload-artifact@v7
        with:
          name: lectures
          path: |
            build/**/final.mp4
            build/**/captions.vtt
            build/**/thumb.jpg
            build/**/catalog-entry.json
            build/**/transcript.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit manifest
        run: |
          git config user.name "video-worker-bot"
          git config user.email "video-worker-bot@users.noreply.github.com"
          git add state/ || true
          if git diff --cached --quiet; then echo "No state change."; exit 0; fi
          git commit -m "collect: advance pipeline ($(date -u +%FT%TZ))"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:"${GITHUB_REF_NAME}" && exit 0
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || {
              # Merge both versions. Taking one side discarded the other runs'
              # records, which is how a fired unit disappeared from the manifest.
              git show ":2:state/manifest.json" > /tmp/ours.json 2>/dev/null || cp state/manifest.json /tmp/ours.json
              git show ":3:state/manifest.json" > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
              python src/merge_manifest.py /tmp/ours.json /tmp/theirs.json state/manifest.json
              git add state/
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            sleep $((RANDOM % 4 + 2))
          done
          echo "Failed to push manifest." >&2; exit 1
